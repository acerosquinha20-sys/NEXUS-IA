name: Gerar APK Nexus IA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Aceitar licenças do Android SDK (o SDK já vem no servidor)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Montar a pasta www com os arquivos do app
        run: |
          mkdir -p www
          cp index.html style.css md.js api.js app.js login-bg.jpg chat-bg.jpg icon.png www/

      - name: Instalar dependências
        run: npm install

      - name: Criar o projeto Android
        run: npx cap add android

      - name: Ícone, tela de abertura e cores
        run: |
          python3 -m pip install pillow
          python3 make_icons.py

      - name: Sincronizar
        run: npx cap sync android

      - name: Compilar o APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renomear o APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Nexus-IA.apk

      - name: Guardar o APK (aba Actions)
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-IA-APK
          path: Nexus-IA.apk

      - name: Publicar em Releases (link direto para baixar no celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Nexus IA v1.${{ github.run_number }}
          files: Nexus-IA.apk
